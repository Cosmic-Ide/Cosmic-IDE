name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install patch tools
        run: brew install binutils jq ncurses zstd gnu-tar python

      - name: Generate glibc.tar.zst
        run: bash ./scripts/build-glibc.sh

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with gradle
        uses: gradle/gradle-build-action@v3.1.0
        with:
          gradle-version: nightly
          arguments: assembleProdDebug

      - name: Upload debug apks
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.abi }}
          path: app/build/outputs/apk/prod/debug/app-prod-${{ matrix.abi }}-debug.apk
