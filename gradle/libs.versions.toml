[versions]

# SDK & Application versions
compileSdk = "37"
compileSdkMinor = "2"
minSdk = "26"
targetSdk = "37"
ideVersion = "3.0.0"
ideVersionCode = "300"

# Build Plugins & Tools
kotlin = "2.4.20"
agp = "9.4.0"
cmake = "4.1.2"
ndk = "30.0.16248370"
nmcp = "1.6.2"

# Libraries
gson = "2.14.0"
zstd-jni = "1.5.7-16"
core-ktx = "1.19.0"
documentfile = "1.1.0"
lifecycle = "2.11.0"
startup = "1.2.0"
rosemoe = "0.24.6"
lsp4j = "1.0.0"
termux = "v0.119.0-beta.3"
markdown-renderer = "0.45.0"
pine = "0.3.0"
coroutines = "1.11.0"
hiddenapibypass = "6.1"
slf4j = "2.1.0-alpha1"
compose-bom = "2026.09.00"
compose-material3 = "1.5.0-alpha28"
activity-compose = "1.13.0"
material-icons = "1.7.8"
adaptive-navigation = "1.3.0"
navigation3 = "1.2.0-rc01"
cascade-compose = "2.3.0"
ktor = "3.5.2"
kotlinx-serialization = "1.11.0"
junit = "4.13.2"
json = "20260814"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup" }

rosemoe-editor-bom = { module = "io.github.rosemoe:editor-bom", version.ref = "rosemoe" }
rosemoe-editor = { module = "io.github.rosemoe:editor", version.ref = "rosemoe" }
rosemoe-language-textmate = { module = "io.github.rosemoe:language-textmate", version.ref = "rosemoe" }
rosemoe-editor-lsp = { module = "io.github.rosemoe:editor-lsp", version.ref = "rosemoe" }
rosemoe-oniguruma-native = { module = "io.github.rosemoe:oniguruma-native", version.ref = "rosemoe" }

lsp4j = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j", version.ref = "lsp4j" }

termux-terminal-emulator = { module = "com.github.termux.termux-app:terminal-emulator", version.ref = "termux" }
termux-terminal-view = { module = "com.github.termux.termux-app:terminal-view", version.ref = "termux" }

markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdown-renderer" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }

pine-core = { module = "top.canyie.pine:core", version.ref = "pine" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "material-icons" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons" }
compose-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "adaptive-navigation" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }

navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

cascade-compose = { module = "me.saket.cascade:cascade-compose", version.ref = "cascade-compose" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcpAggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
